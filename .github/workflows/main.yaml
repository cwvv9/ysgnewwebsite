name: Sync Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Sync repository
        run: |
          mkdir -p /appl/ysgnewwebsite
          rsync -av --delete\
            --exclude=".git/" \
            --exclude=".github/" \
            "$GITHUB_WORKSPACE/" /appl/ysgnewwebsite/